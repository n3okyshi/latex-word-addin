<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>LaTeX Add-in</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        body { padding: 15px; margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .container { display: flex; flex-direction: column; gap: 15px; }
        textarea { width: 100%; padding: 8px; border: 1px solid #666; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        button { background-color: #0078d4; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:disabled { background-color: #c8c8c8; cursor: not-allowed; }
        #preview { text-align: center; border: 1px dashed #ccc; padding: 10px; min-height: 50px; border-radius: 4px; overflow-x: auto; font-size: 1.2em; }
        .error-alert { background-color: #fde7e9; color: #a4262c; padding: 12px; border-radius: 4px; font-size: 12px; display: none; align-items: flex-start; gap: 8px; border-left: 4px solid #a4262c; }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="latexInput" placeholder="Ex: \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}" rows="5"></textarea>
        <div id="errorAlert" class="error-alert">
            <span id="errorMessage">Erro de sintaxe</span>
        </div>
        <button id="insertBtn">Inserir Equação Editável</button>
        <div id="preview">
            <p style="font-size: 12px; color: #666;">Preview aparecerá aqui</p>
        </div>
    </div>
    <script src="taskpane.js"></script>
</body>
</html>
