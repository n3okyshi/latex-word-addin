<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>LaTeX Add-in</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
        h2 { font-size: 16px; color: #2b579a; }
        textarea { width: 100%; height: 120px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background-color: #2b579a; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #1e3f6f; }
        #preview { margin-top: 15px; text-align: center; border: 1px dashed #ccc; padding: 10px; min-height: 50px; }
    </style>
</head>
<body>
    <h2>Digite sua Equação LaTeX</h2>
    
    <textarea id="latexInput" placeholder="Ex: \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}"></textarea>
    <button id="insertBtn">Inserir no Documento</button>

    <div id="preview">
        <p style="font-size: 12px; color: #666;">Preview aparecerá aqui</p>
    </div>

    <script src="taskpane.js"></script>
</body>
</html>
